name: academic-mvp

services:
  db:
    image: postgres:15.7-bookworm
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    # Tidak ada `ports:` — S3/MinIO hanya dipakai di jaringan internal compose.
    # Memaparkannya ke host membuka konsol object storage ke internet; saat ini
    # backend memakai filesystem, jadi tidak butuh akses dari luar.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /code/storage
    # Volume WAJIB: storage dataset user harus hidup lintas redeploy, dan harus
    # bisa dibaca oleh service worker (lihat service `worker` di bawah).
    # Sebelumnya tidak ada volume sama sekali -> file hanya ada di layer
    # container, hilang saat restart, dan worker tak pernah bisa membacanya.
    volumes:
      - backend_storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.core.queue:celery_app worker --loglevel=info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /code/storage
    # Volume yang SAMA dengan backend — beda container, beda filesystem.
    volumes:
      - backend_storage:/code/storage
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* di-inline Next.js saat BUILD, bukan saat runtime. Karena
      # itu nilainya dikirim sebagai build arg, bukan environment. Salah ini
      # bikin image frontend nunjuk ke API yang salah dan hanya ketahuan saat
      # dijalankan. Set FRONTEND_URL/https-domain Anda sebelum build.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  # Dataset user yang diunggah (STORAGE_DIR backend & worker).
  # Untuk produksi: arahkan ke block volume supaya aman & besar.
  backend_storage:
