# DDEV local env — academic MVP.
# - db + redis dari DDEV (postgres:15, redis addon). Host di dalam network: db, redis.
# - backend/frontend/worker didefinisikan di sini (parity dengan ../compose.yml untuk VPS prod).
# - MinIO/S3 DINONAKTIFKAN di DDEV local (registry 401/pull-denied); dev pakai filesystem, prod pakai compose.yml.
# - Jalankan: ddev start  →  https://academic.ddev.site (web), backend :8000, frontend :3000 via web_extra_exposed_ports.
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ddev-academic-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://db:db@db:5432/db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:3100
      # Izin juga IP LAN privat: browser sering dibuka lewat Network URL next dev
      # (mis. http://192.168.x.x:3100); tanpa ini preflight gagal dan semua fetch
      # tampil sebagai "Failed to fetch". Lihat backend/app/core/config.py.
      - BACKEND_CORS_REGEX=https?://(localhost|127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})(:\d+)?
      # DEV ONLY: sengaja TIDAK ada kunci di repo (repo publik).
      # Kosong → backend fallback ke turunan JWT_SECRET, ditandai 'dev-fallback'
      # di metadata koneksi. Untuk OAuth nyata, set di mesin Anda:
      #   openssl rand -base64 32
      # lalu jalankan ddev dengan env tersebut (atau taruh di .env gitignored).
      # Prod: set via secrets, lihat .env.example + docs/runbook-prod.md.
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      - SCRAPER_ALLOWLIST=en.wikipedia.org,wikipedia.org,docs.google.com,spreadsheets.google.com,httpbin.org,r.jina.ai
      # S3/MinIO nonaktif di local DDEV (registry minio diblokir, 401/pull denied).
      # Dev gunakan filesystem volume; S3 aktif di VPS prod via compose.yml (perlu docker login).
      # - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=academic-datasets
      - S3_REGION=us-east-1
      - JWT_SECRET=local_only_change_me_64char______________________
      - SOFTWARE_VERSION=0.1.0+mvp
      - MAX_UPLOAD_MB=50
      - STORAGE_DIR=/code/storage
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
      # Login Google (OAuth2): isi di .env / environment host (lihat .env.example).
      # Kosong → endpoint /auth/google/* balas 501 yang jelas (tidak crash).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3100}
    ports:
      - "8100:8000"
    volumes:
      - backend_storage:/code/storage
    external_links:
      - ddev-academic-db:db
      - ddev-academic-redis:redis
    labels:
      com.ddev.site-name: academic
      com.ddev.approot: $DDEV_APPROOT

  # Frontend TIDAK di Docker (keputusan dev): jalankan lokal via Node.js:
  #   cd frontend && npm install && NEXT_PUBLIC_API_URL=http://localhost:8100 npm run dev -- -p 3100
  # (port 3100 dikosongkan untuk npm dev; lihat README.)

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ddev-academic-worker
    restart: unless-stopped
    command: celery -A app.core.queue:celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://db:db@db:5432/db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/code/storage
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    external_links:
      - ddev-academic-db:db
      - ddev-academic-redis:redis
    volumes:
      - backend_storage:/code/storage
    labels:
      com.ddev.site-name: academic
      com.ddev.approot: $DDEV_APPROOT

volumes:
  backend_storage:
